<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion | EduPay Congo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { height: 100%; font-family: 'Inter', sans-serif; overflow: hidden; }

        .login-wrapper {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #bg-video {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: -2;
        }

        .overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: -1;
        }

        .form-card {
            background: rgba(255, 255, 255, 0.98);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 380px;
            text-align: center;
        }

        .brand { font-size: 28px; font-weight: 800; margin-bottom: 8px; color: #333; }
        .brand span { color: #1a73e8; }
        p.subtitle { color: #666; font-size: 14px; margin-bottom: 25px; }

        .form-group { margin-bottom: 15px; text-align: left; }
        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }
        input:focus { border-color: #1a73e8; box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.1); }

        #error {
            color: #d93025;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 15px;
            min-height: 18px;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: #1a73e8;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-login:hover { background: #1557b0; transform: translateY(-1px); }
        .btn-login:disabled { background: #ccc; cursor: not-allowed; }

        .footer-note {
            margin-top: 20px;
            font-size: 12px;
            color: #999;
        }

        /* --- STYLE POUR LE BOUTON ENGRENAGE ET MODAL MASTER --- */
        .admin-gear {
            position: fixed;
            bottom: 15px;
            right: 15px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 10px;
            border-radius: 50%;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: 0.3s;
            z-index: 100;
        }
        .admin-gear:hover { background: rgba(255,255,255,0.3); transform: rotate(90deg); }

        #modalMaster {
            display:none; 
            position:fixed; 
            top:0; left:0; width:100%; height:100%; 
            background:rgba(0,0,0,0.85); 
            z-index:10000; 
            align-items:center; 
            justify-content:center;
            backdrop-filter: blur(8px);
        }
        .modal-master-content {
            background: white;
            padding: 30px;
            border-radius: 20px;
            width: 90%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <video autoplay muted loop playsinline id="bg-video">
            <source src="video/video1.mp4" type="video/mp4">
        </video>

        <div class="overlay"></div>

        <div class="form-card">
            <div class="brand">EduPay <span>Congo</span></div>
            <p class="subtitle">Identifiez-vous pour accéder à la gestion</p>
            
            <form id="loginForm">
                <div class="form-group">
                    <input type="email" id="loginEmail" placeholder="Email professionnel" required>
                </div>
                <div class="form-group">
                    <input type="password" id="loginPassword" placeholder="Mot de passe" required>
                </div>
                
                <div id="error"></div>
                
                <button type="submit" id="btnLogin" class="btn-login">Se connecter</button>
            </form>

            <div class="footer-note">
                &copy; 2026 EduPay Congo - Tous droits réservés.
            </div>
        </div>
    </div>

    <button class="admin-gear" onclick="ouvrirConnexionMaster()">⚙️</button>

    <div id="modalMaster">
        <div class="modal-master-content">
            <h3 style="margin-bottom: 10px; color: #1a73e8; font-weight: 800;">ACCÈS MASTER</h3>
            <p style="font-size: 13px; color: #666; margin-bottom: 20px;">Connexion réservée au propriétaire</p>
            
            <div class="form-group">
                <input type="email" id="masterEmail" placeholder="Email Master">
            </div>
            <div class="form-group">
                <input type="password" id="masterPass" placeholder="Mot de passe">
            </div>
            
            <button onclick="connexionMaster()" id="btnMaster" class="btn-login" style="margin-top: 10px;">
                Entrer dans le Dashboard
            </button>
            
            <button onclick="document.getElementById('modalMaster').style.display='none'" 
                    style="margin-top: 20px; background: none; border: none; color: #999; cursor: pointer; font-size: 13px; font-weight: 500;">
                Retour à l'accueil
            </button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    
    <script src="js/firebase.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
